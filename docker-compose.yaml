version: '3.9'

services:
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=sqlite
      - SQLITE_FILENAME=/var/lib/temporal/sqlite.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/var/lib/temporal
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.mock-llm
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  temporal-data:

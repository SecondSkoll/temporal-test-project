[pytest]
# Run tests from the src directory so relative imports work without install
testpaths = tests
pythonpath = src

# Default asyncio mode for pytest-asyncio
asyncio_mode = auto

# Show short test summary and verbose output by default
addopts = -v --tb=short

# Markers
markers =
    unit: Unit tests (no network, no Temporal server)
    integration: Integration tests (require mock servers or Temporal dev server)
